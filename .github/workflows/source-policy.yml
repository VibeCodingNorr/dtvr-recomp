# SPDX-License-Identifier: GPL-3.0-only
name: Source distribution policy
on: [push, pull_request]
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/check_repository.py
      - run: python tools/project_version.py
      - if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/project_version.py --release-tag "$GITHUB_REF_NAME" --check-tag-history
      - run: python -m unittest discover -s tests -p 'test_*.py'
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsdl2-dev libsdl2-ttf-dev libvorbis-dev libjson-c-dev ffmpeg
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
